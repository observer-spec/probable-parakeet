name: Start GUI Desktop

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Chrome Remote Desktop Auth Code Command'
        required: true
      pin:
        description: '6-digit PIN to unlock desktop'
        required: true
        default: '123456'

jobs:
  start-gui:
    runs-on: ubuntu-latest
    steps:
      - name: Install XFCE Desktop & Google Chrome
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-terminal \
            desktop-base \
            xbase-clients \
            python3-psutil \
            xvfb
          
          # Install Chrome Remote Desktop
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg -i chrome-remote-desktop_current_amd64.deb || sudo apt-get install -f -y
          rm chrome-remote-desktop_current_amd64.deb

          # Install Chrome Web Browser
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          rm google-chrome-stable_current_amd64.deb

      - name: Configure Desktop Session
        run: |
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'

      - name: Start Remote Desktop Host
        run: |
          ${{ github.event.inputs.crd_code }} --pin=${{ github.event.inputs.pin }}

      - name: Keep Session Alive (6 Hours)
        run: |
          echo "========================================="
          echo "GUI is live! Connect at:"
          echo "https://remotedesktop.google.com/access"
          echo "========================================="
          sleep 21600 # 6 hours max limit
