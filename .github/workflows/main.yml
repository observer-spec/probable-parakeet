name: Start Windows GUI Desktop

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Chrome Remote Desktop Code or Command'
        required: true
      pin:
        description: '6-digit PIN'
        required: true
        default: '123456'

jobs:
  start-windows:
    runs-on: windows-latest
    steps:
      - name: Download & Install Chrome Remote Desktop
        run: |
          Write-Host "Downloading Chrome Remote Desktop..."
          Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile "chromeremotedesktophost.msi"
          
          Write-Host "Installing Chrome Remote Desktop..."
          Start-Process msiexec.exe -ArgumentList '/i chromeremotedesktophost.msi /quiet /qn /norestart' -NoNewWindow -Wait
          Remove-Item chromeremotedesktophost.msi

      - name: Start Remote Desktop Host
        run: |
          Write-Host "Registering Windows Host with Google..."
          $rawInput = '${{ github.event.inputs.crd_code }}'
          $pin = "${{ github.event.inputs.pin }}"
          $hostExe = "$env:PROGRAMFILES\Google\Chrome Remote Desktop\CurrentVersion\remotedesktop_host.exe"

          # Automatically extract code if embedded in a pasted command
          if ($rawInput -match '4/[0-9a-zA-Z_-]+') {
              $authCode = $Matches[0]
              Write-Host "Found Auth Code: $authCode"
              cmd /c """$hostExe"" --start --oauth-authcode=""$authCode"" --redirect-url=""https://remotedesktop.google.com/headless"" --pin=""$pin"""
          } else {
              $cleanCmd = $rawInput -replace '^\&\s*', ''
              cmd /c "$cleanCmd --pin=$pin"
          }

      - name: Keep Alive Loop
        run: |
          Write-Host "================================================="
          Write-Host "SUCCESS! Connect at: https://remotedesktop.google.com/access"
          Write-Host "================================================="
          while ($true) {
              Write-Host "Runner active: $(Get-Date)"
              Start-Sleep -Seconds 300
          }
