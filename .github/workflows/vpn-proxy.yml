name: Tailscale VPN & Proxy

concurrency:
  group: vpn-proxy-singleton
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Runtime duration in hours (1-6)'
        required: false
        default: '6'
      enable_exit_node:
        description: 'Advertise as Tailscale Exit Node (Full VPN routing)'
        type: boolean
        required: false
        default: true
      enable_socks5:
        description: 'Enable SOCKS5 proxy on port 1080'
        type: boolean
        required: false
        default: true
      enable_http_proxy:
        description: 'Enable HTTP proxy on port 8080'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  vpn-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Linux Kernel Networking
        run: |
          echo "net.ipv4.ip_forward = 1" | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          echo "net.ipv6.conf.all.forwarding = 1" | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          sudo sysctl -p /etc/sysctl.d/99-tailscale.conf

          # Enable NAT masquerade for outbound traffic
          sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
          sudo ip6tables -t nat -A POSTROUTING -o eth0 -j MASQUERADE 2>/dev/null || true

      - name: Tailscale Connect & Proxy Init
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          ENABLE_EXIT_NODE: ${{ inputs.enable_exit_node }}
          ENABLE_SOCKS5: ${{ inputs.enable_socks5 }}
          ENABLE_HTTP_PROXY: ${{ inputs.enable_http_proxy }}
        run: |
          test -n "$TAILSCALE_AUTHKEY" || { echo "::error::TAILSCALE_AUTHKEY secret is empty"; exit 1; }

          # Install latest tailscale
          curl -fsSL https://tailscale.com/install.sh | sh

          # SOCKS5 and HTTP proxy listeners belong to tailscaled daemon flags
          DAEMON_FLAGS=""
          if [ "$ENABLE_SOCKS5" = "true" ]; then
            DAEMON_FLAGS="$DAEMON_FLAGS --socks5-server=0.0.0.0:1080"
          fi
          if [ "$ENABLE_HTTP_PROXY" = "true" ]; then
            DAEMON_FLAGS="$DAEMON_FLAGS --outbound-http-proxy-listen=0.0.0.0:8080"
          fi

          if [ -n "$DAEMON_FLAGS" ]; then
            echo "Configuring tailscaled with: $DAEMON_FLAGS"
            echo "FLAGS=\"$DAEMON_FLAGS\"" | sudo tee -a /etc/default/tailscaled
            sudo systemctl restart tailscaled
            sleep 2
          fi

          UP_ARGS="--hostname=gh-vpn-proxy --accept-routes --reset"
          if [ "$ENABLE_EXIT_NODE" = "true" ]; then
            UP_ARGS="$UP_ARGS --advertise-exit-node"
          fi

          echo "Running tailscale up $UP_ARGS"
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" $UP_ARGS

          # Fetch Tailscale IP
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale Node IP: $TS_IP"

      - name: Publish Live Endpoint Docs
        env:
          TS_IP: ${{ env.TAILSCALE_IP }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cat <<EOF > CURRENT_VPN_ENDPOINT.md
# Active Tailscale VPN & Proxy Endpoint

- **Node Name:** \`gh-vpn-proxy\`
- **Tailscale IPv4:** \`$TS_IP\`
- **Exit Node Mode:** ${{ inputs.enable_exit_node }}
- **SOCKS5 Proxy:** \`$TS_IP:1080\`
- **HTTP Proxy:** \`$TS_IP:8080\`
- **Started:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

### How to use:
1. **As Full VPN (Exit Node):**
   - On Tailscale app (PC/Mac/Phone) -> Right click / Settings -> **Exit Nodes** -> Select \`gh-vpn-proxy\`.
   - *(Note: First time in Tailscale Admin Console -> Machines -> \`gh-vpn-proxy\` -> Edit route settings -> Enable exit node)*.
2. **As SOCKS5 Proxy:**
   - Set proxy server in Chrome/Firefox/SwitchyOmega: \`$TS_IP:1080\` (SOCKS5).
3. **As HTTP Proxy:**
   - Set proxy server in terminal/app: \`export https_proxy=http://$TS_IP:8080\`.
EOF

          git config user.name "observer-spec"
          git config user.email "observer@amnuaysilpa.ac.th"
          git add CURRENT_VPN_ENDPOINT.md
          git diff --staged --quiet || (git commit -m "docs: publish active Tailscale VPN endpoint [skip ci]" && git push origin main)

          cat CURRENT_VPN_ENDPOINT.md >> $GITHUB_STEP_SUMMARY

      - name: Keep Tunnel Alive
        run: |
          HOURS=${{ inputs.duration_hours }}
          SECONDS=$(( HOURS * 3600 ))
          echo "Keeping VPN Proxy alive for $HOURS hours ($SECONDS seconds)..."
          sleep $SECONDS
